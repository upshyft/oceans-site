services:
  - type: web
    name: oceans-site
    runtime: static
    repo: https://github.com/upshyft/oceans-site
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    domains:
      - www.theoceans.com
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=604800
      - path: /contact
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /valuation
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /investor
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /loan-signing
        name: Content-Type
        value: text/html; charset=utf-8
      - path: /rate
        name: Content-Type
        value: text/html; charset=utf-8
