services:
  - type: web
    name: oceans-site
    runtime: static
    repo: https://github.com/upshyft/oceans-site
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    domains:
      - www.theoceans.com
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=604800
