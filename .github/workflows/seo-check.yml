name: SEO checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Page metadata, schema, sitemap, and forms
        run: python3 scripts/check_seo.py
      - name: Clean URLs are served from the HTML sources
        run: python3 scripts/check_clean_urls.py
      - name: Guides, market-figure fallback, and checklist privacy
        run: python3 scripts/check_guides.py
